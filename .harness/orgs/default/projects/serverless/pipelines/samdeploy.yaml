pipeline:
  name: samdeploy
  identifier: samdeploy
  projectIdentifier: serverless
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: sam-deploy
        identifier: samdeploy
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: infra1
              namespace: dev
              automountServiceAccountToken: true
              nodeSelector: {}
              containerSecurityContext:
                privileged: true
              os: Linux
          execution:
            steps:
              - step:
                  type: Background
                  name: Background_1
                  identifier: Background_1
                  spec:
                    connectorRef: docker
                    image: docker:24-dind
                    shell: Sh
                    command: dockerd --host=tcp://0.0.0.0:2375
                    privileged: true
                    envVariables:
                      DOCKER_TLS_CERTDIR: ""
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    connectorRef: docker
                    image: docker:cli
                    shell: Sh
                    command: docker info
                    privileged: false
                    envVariables:
                      DOCKER_HOST: tcp://0.0.0.0:2375
  properties:
    ci:
      codebase:
        connectorRef: github
        repoName: SAM-app
        build: <+input>
