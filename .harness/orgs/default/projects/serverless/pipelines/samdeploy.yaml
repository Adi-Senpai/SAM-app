pipeline:
  name: samdeploy
  identifier: samdeploy
  projectIdentifier: serverless
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: aws-auth
        identifier: awsauth
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          cat /etc/os-release
                          curl -O https://www.rpmfind.net/linux/almalinux/8.10/BaseOS/x86_64/os/Packages/unzip-6.0-48.el8_10.x86_64.rpm
                          rpm -i unzip-6.0-48.el8_10.x86_64.rpm
                          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"

                          unzip awscliv2.zip
                          sudo ./aws/install

                          aws --version
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
