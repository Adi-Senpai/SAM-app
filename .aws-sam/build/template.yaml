AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for FastAPI Lambda function (Docker image) with API Gateway
  integration
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
Resources:
  FastAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fastapi-handler
      PackageType: Image
      Description: FastAPI application served through AWS Lambda using Docker image
      Events:
        RootPath:
          Type: Api
          Properties:
            Path: /
            Method: GET
            RestApiId:
              Ref: FastAPIApi
      ImageUri: fastapifunction:fastapi-lambda
    Metadata:
      DockerContext: C:\Users\adity\Documents\aws-sam-serverless\sam-app-3
      DockerTag: fastapi-lambda
      Dockerfile: Dockerfile
      SamResourceId: FastAPIFunction
  FastAPIApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      TracingEnabled: true
      Name: fastapi-api
Outputs:
  FastAPIFunctionArn:
    Description: FastAPI Lambda Function ARN
    Value:
      Fn::GetAtt:
      - FastAPIFunction
      - Arn
  FastAPIApiEndpoint:
    Description: API Gateway endpoint URL for prod environment
    Value:
      Fn::Sub: https://${FastAPIApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
